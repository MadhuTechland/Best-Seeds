plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.driver.bestseed"
    // Pinned to 36 explicitly. `flutter.compileSdkVersion` floats with the
    // installed Flutter SDK, and `in_app_update` (transitively pulls in
    // com.google.android.play:app-update:2.1.0) requires compileSdk >= 34.
    // Any teammate or CI runner on an older Flutter would fail the build
    // with "requires libraries and applications that depend on it to
    // compile against version 34 or later". Match the user app which
    // already pins compileSdk = 36.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
            // Sign with all four schemes so the APK installs on every Android
            // version the app supports: v1 (JAR) is required for Android <7,
            // v2/v3 for modern devices, v4 for incremental install. Without
            // v1, older phones show "There was a problem parsing the package"
            // — the SMS Retriever hash also depends on the signing cert, but
            // enabling extra schemes doesn't change the cert, only how it's
            // wrapped in the APK.
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = true
        }
    }

    defaultConfig {
        applicationId = "com.driver.bestseed"
        minSdk = flutter.minSdkVersion
        // Pinned to 36 (see compileSdk comment above). targetSdk floating
        // with Flutter would silently regress Play Console review policy.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source = "../.."
}
