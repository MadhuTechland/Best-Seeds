plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Google Maps key for the manifest, read straight out of the gitignored
// lib/utils/secrets.dart — the same file the Dart code uses, so the key is
// defined in exactly one place and no build flag is needed. CI may set a
// GOOGLE_MAPS_API_KEY environment variable instead.
def googleMapsApiKey = System.getenv('GOOGLE_MAPS_API_KEY')
if (!googleMapsApiKey) {
    def secretsFile = rootProject.file('../lib/utils/secrets.dart')
    if (secretsFile.exists()) {
        def matcher = secretsFile.text =~ /googleMaps\s*=\s*'([^']*)'/
        googleMapsApiKey = matcher ? matcher[0][1] : ''
    } else {
        logger.warn('⚠️  lib/utils/secrets.dart not found — the Google Maps key will be ' +
                'empty and maps will render blank. Copy secrets.example.dart to secrets.dart.')
        googleMapsApiKey = ''
    }
}
if (!googleMapsApiKey) {
    logger.warn('⚠️  googleMaps key missing/empty in secrets.dart — maps will render blank.')
}

android {
    namespace = "com.driver.bestseed"
    // Pinned to 36 explicitly. `flutter.compileSdkVersion` floats with the
    // installed Flutter SDK, and `in_app_update` (transitively pulls in
    // com.google.android.play:app-update:2.1.0) requires compileSdk >= 34.
    // Any teammate or CI runner on an older Flutter would fail the build
    // with "requires libraries and applications that depend on it to
    // compile against version 34 or later". Match the user app which
    // already pins compileSdk = 36.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
            // Sign with all four schemes so the APK installs on every Android
            // version the app supports: v1 (JAR) is required for Android <7,
            // v2/v3 for modern devices, v4 for incremental install. Without
            // v1, older phones show "There was a problem parsing the package"
            // — the SMS Retriever hash also depends on the signing cert, but
            // enabling extra schemes doesn't change the cert, only how it's
            // wrapped in the APK.
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = true
        }
    }

    defaultConfig {
        applicationId = "com.driver.bestseed"
        minSdk = flutter.minSdkVersion
        // Pinned to 36 (see compileSdk comment above). targetSdk floating
        // with Flutter would silently regress Play Console review policy.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Substituted into ${GOOGLE_MAPS_API_KEY} in AndroidManifest.xml so the
        // key never appears in a tracked file.
        manifestPlaceholders += [GOOGLE_MAPS_API_KEY: googleMapsApiKey]
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }

    // Ship the bundle as ONE self-contained APK instead of a base plus ABI /
    // density / language splits.
    //
    // play-core (pulled in by in_app_update) refuses to start the app when the
    // installed base APK is missing any of its splits, showing "Something went
    // wrong — Check that Google Play is enabled on your device...". That was
    // happening on UPDATE only: a fresh install delivered a matching set, but
    // an update could leave the device with a base whose splits didn't apply,
    // and a full uninstall/reinstall cleared it.
    //
    // With no splits there is nothing to go missing, so the check can never
    // trip. The cost is download size — every ABI ships in the one APK.
    bundle {
        language { enableSplit = false }
        density { enableSplit = false }
        abi { enableSplit = false }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source = "../.."
}
